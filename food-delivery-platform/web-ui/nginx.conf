server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving upstreams per request (via variables) means
    # the UI still starts even if a backend container is restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/customers/...   -> customer-service:9001/customers/...
    location /api/customers {
        set $upstream customer-service:9001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    # /api/restaurants/... -> restaurant-service:9002/restaurants/...
    location /api/restaurants {
        set $upstream restaurant-service:9002;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    # /api/orders/...      -> order-service:9003/orders/...
    location /api/orders {
        set $upstream order-service:9003;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    # /api/deliveries/...  -> delivery-service:9005/deliveries/...
    location /api/deliveries {
        set $upstream delivery-service:9005;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    # /api/admin/...       -> admin-service:9006/admin/...
    location /api/admin {
        set $upstream admin-service:9006;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }
}
